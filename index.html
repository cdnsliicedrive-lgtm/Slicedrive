<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>  <style>
    body {
      margin: 0;
      background: #000;
    }

    video {
      width: 100%;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

    #title {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 14px;
    }
  </style></head><body>  <p id="title"></p><video id="player" controls playsinline controlsList="nodownload"></video>

  <!-- Link tersembunyi untuk di-klik otomatis --><a id="autoLink" href="https://www.profitableratecpmnetwork.com/sp97650b8i?key=c838416b6d47caefb16832c219ecb151" target="_blank" style="display:none;"></a>

  <script>
    const JSON_URL = "videos.json";
    const DIRECT_LINK = "https://www.profitableratecpmnetwork.com/sp97650b8i?key=c838416b6d47caefb16832c219ecb151";

    const video = document.getElementById("player");
    const title = document.getElementById("title");
    const autoLink = document.getElementById("autoLink");

    let redirected = false;

    fetch(JSON_URL)
      .then(res => res.json())
      .then(data => {
        const vids = data.videos;
        const id = decodeURIComponent(location.hash.replace("#/", ""));

        let selected = vids.find(v => v.id === id);

        if (!selected) {
          selected = vids[0];
        }

        video.src = selected.cdn;
        title.innerText = selected.id;
      });

    // Auto-klik di detik ke-30
    video.addEventListener("timeupdate", () => {
      if (!redirected && video.currentTime >= 30) {
        redirected = true;
        autoLink.click();
      }
    });
  </script></body>
</html>
