<script>
const JSON_URL = "videos.json";
const DIRECT_LINK = "https://www.effectivecpmnetwork.com/g05tnv06z?key=308d94d906e2fb2f2e1134eb3122b5ae";

const video = document.getElementById("player");
const title = document.getElementById("title");

let clicked = false;
let redirected = false;

fetch(JSON_URL)
.then(res => res.json())
.then(data => {

  const vids = data.videos;
  const id = decodeURIComponent(location.hash.replace("#/", ""));

  let selected = vids.find(v => v.id === id);

  if (!selected) {
    selected = vids[0];
  }

  video.src = selected.cdn;
  title.innerText = selected.id;

});

video.addEventListener("click", () => {
  if (!clicked) {
    clicked = true;
    window.location.href = DIRECT_LINK;
  }
}, { once: true });

video.addEventListener("timeupdate", () => {
  if (!redirected && video.currentTime >= 30){
    redirected = true;
    window.location.href = DIRECT_LINK;
  }
});
</script>
