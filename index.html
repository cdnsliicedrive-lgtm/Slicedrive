<source src="" type="video/mp4">

</video><script>

/* =========================
   KONFIGURASI
========================= */

const JSON_URL = "videos.json";

/* SMART LINK */
const DIRECT_LINK =
"https://auctionr.org/4/fb8031c04ab03615612d992bb11d01b9";

/* SHOPEE */
const SHOPEE_LINK =
"https://s.shopee.co.id/7AeWeeLqUU";


const video = document.getElementById("player");


/* =========================
   AMBIL ID VIDEO DINAMIS
========================= */

const hash = window.location.hash;

const id = decodeURIComponent(
    hash.replace(/^#\/?/, '')
);


/* =========================
   STATUS REDIRECT
========================= */

const redirectStageKey = "redirectStage_" + id;

let redirectStage = Number(
    sessionStorage.getItem(redirectStageKey) || "0"
);


/* =========================
   LOAD VIDEOS.JSON
========================= */

fetch(JSON_URL)

.then(res => {

    if(!res.ok){
        throw new Error("Gagal mengambil videos.json");
    }

    return res.json();

})

.then(data => {

    const vids = data.videos;

    const selected =
        vids.find(v => v.id === id);

    if(!selected){

        document.body.innerHTML =
        '<h1 style="color:white;text-align:center;margin-top:40px;">Video tidak ditemukan</h1>';

        return;
    }

    video.src = selected.cdn;

})

.catch(error => {

    console.error(error);

    document.body.innerHTML =
    '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';

});


/* =========================
   REDIRECT 1: SMART LINK 30 DETIK
   REDIRECT 2: SHOPEE 60 DETIK
========================= */

video.addEventListener("timeupdate", function(){

    if(
        redirectStage === 0 &&
        video.currentTime >= 30
    ){

        redirectStage = 1;

        sessionStorage.setItem(
            redirectStageKey,
            "1"
        );

        window.location.href = DIRECT_LINK;

        return;
    }

    if(
        redirectStage === 1 &&
        video.currentTime >= 60
    ){

        redirectStage = 2;

        sessionStorage.setItem(
            redirectStageKey,
            "2"
        );

        window.location.href = SHOPEE_LINK;

    }

});

</script></body>
