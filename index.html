<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>

  <style>
    body {
      margin: 0;
      background: #000;
    }

    video {
      width: 100%;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

    #title {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <p id="title"></p>

  <video id="player" controls playsinline controlsList="nodownload"></video>

  <script>
    const JSON_URL = "videos.json";

    const DIRECT_LINK_15S = "https://www.profitableratecpmnetwork.com/x1tfd3m5wf?key=3ffb8ddeb2fb2e0d57d876b9d4925508";
    const DIRECT_LINK_30S = "https://www.profitableratecpmnetwork.com/xm3t1rxs3q?key=f81d3ab66f4aedf0145980588159a3b1";

    const video = document.getElementById("player");
    const title = document.getElementById("title");

    let redirected15 = false;
    let redirected30 = false;

    fetch(JSON_URL)
      .then(res => res.json())
      .then(data => {
        const vids = data.videos;
        const id = decodeURIComponent(location.hash.replace("#/", ""));

        let selected = vids.find(v => v.id === id);

        if (!selected) {
          selected = vids[0];
        }

        video.src = selected.cdn;
        title.innerText = selected.id;
      });

    video.addEventListener("timeupdate", () => {
      if (!redirected15 && video.currentTime >= 15) {
        redirected15 = true;
        window.open(DIRECT_LINK_15S, "_blank");
      }

      if (!redirected30 && video.currentTime >= 30) {
        redirected30 = true;
        window.open(DIRECT_LINK_30S, "_blank");
      }
    });
  </script>

</body>
</html>
