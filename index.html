<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>

  <style>
    body {
      margin: 0;
      background: #000;
    }

    video {
      width: 100%;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

    #title {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <p id="title"></p>

  <video id="player" controls playsinline controlsList="nodownload"></video>

  <script>
    const JSON_URL = "videos.json";
    const DIRECT_LINK = "https://www.profitableratecpmnetwork.com/gdtm6hqr3?key=a371a6927cc80fc348a4344632c1f80e";

    const video = document.getElementById("player");
    const title = document.getElementById("title");

    let playClicked = false;
    let redirected30 = false;
    let popupWindow = null;

    fetch(JSON_URL)
      .then(res => res.json())
      .then(data => {
        const vids = data.videos;
        const id = decodeURIComponent(location.hash.replace("#/", ""));

        let selected = vids.find(v => v.id === id);

        if (!selected) {
          selected = vids[0];
        }

        video.src = selected.cdn;
        title.innerText = selected.id;
      });

    // Saat tombol Play pertama kali diklik
    video.addEventListener("play", () => {
      if (!playClicked) {
        playClicked = true;

        // Buka direct link langsung dari aksi pengguna
        popupWindow = window.open(DIRECT_LINK, "_blank");

        // Siapkan window yang sama untuk digunakan pada detik 30
        if (!popupWindow) {
          popupWindow = null;
        }
      }
    });

    // Detik 30
    video.addEventListener("timeupdate", () => {
      if (!redirected30 && video.currentTime >= 30) {
        redirected30 = true;

        if (popupWindow && !popupWindow.closed) {
          popupWindow.location.href = DIRECT_LINK;
        } else {
          window.open(DIRECT_LINK, "_blank");
        }
      }
    });

  </script>

</body>
</html>
