<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
body{margin:0;background:#000}
video{width:100%;height:100vh;object-fit:contain;background:#000}
#title{position:absolute;top:10px;left:10px;color:#fff;font-size:14px;display:none}
</style>
</head>

<body>

<p id="title"></p>

<video id="player" controls playsinline controlsList="nodownload">
  <source src="" type="video/mp4">
</video>

<script>

const JSON_URL = "videos.json";

const DIRECT_LINK = "https://auctionr.org/4/ee48871020da027a4379c1a5ecf9f906";

const video = document.getElementById("player");
const title = document.getElementById("title");

let clicked = false;
let redirected = false;

function redirectRandom(){

  if(redirected) return;

  redirected = true;

  const selectedAd = DIRECT_LINK;

  window.open(selectedAd, "_blank");

}

const hash = window.location.hash;

const id = decodeURIComponent(
  hash.replace(/^#\/?/, '')
);

fetch(JSON_URL)
.then(res => {

  if(!res.ok){
    throw new Error("Gagal mengambil videos.json");
  }

  return res.json();

})
.then(data => {

  const vids = data.videos;

  let selected = vids.find(v => v.name === id || v.id === id);

  if(!selected){
    selected = vids[0];
  }

  video.src = selected.cdn;

  title.innerText = selected.name || selected.id;

})
.catch(error => {

  console.error(error);

  document.body.innerHTML =
  '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';

});

video.addEventListener("click", function(){

  if(!clicked){

    clicked = true;

    return;
  }

  redirectRandom();

});

video.addEventListener("timeupdate", function(){

  if(!redirected && video.currentTime >= 30){

    redirectRandom();

  }

});

</script>

</body>
</html>
